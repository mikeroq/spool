<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#0a0a0a"/>
  <!-- Printer body -->
  <rect x="5" y="12" width="22" height="13" rx="2" fill="#0d1a0d" stroke="#44dd44" stroke-width="1.5"/>
  <!-- Paper input slot -->
  <rect x="9" y="8" width="14" height="5" rx="1" fill="#0d2a0d" stroke="#44dd44" stroke-width="1"/>
  <!-- Output paper -->
  <rect x="10" y="21" width="12" height="7" rx="0.5" fill="#ddeedd" opacity="0.88"/>
  <!-- Error indicator light -->
  <circle cx="20" cy="16" r="2.5" fill="#ff3333" opacity="0.95"/>
  <circle cx="20" cy="16" r="3.5" fill="none" stroke="#ff3333" stroke-width="0.5" opacity="0.45"/>
</svg>
